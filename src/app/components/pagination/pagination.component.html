<nav class="pagination" aria-label="Sideskift">

  <span class="pagination__status">Side {{ page() }} af {{ totalPages() }}</span>
  <button type="button" (click)="goToNext()" [disabled]="!hasNext()">Næste &raquo;</button>
</nav>
